<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Workora · آفلاین</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7fa; --text:#12151c; --muted:#667085; --card:#fff; --accent:#4f46e5; --accent2:#7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d13; --text:#eef0f6; --muted:#9ba4b7; --card:#141720; --accent:#8b8cf8; --accent2:#c084fc; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
    font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif; line-height:1.8; text-align:center; }
  .card { max-width:380px; width:100%; padding:36px 28px; border-radius:28px; background:var(--card); border:1px solid color-mix(in srgb,var(--text) 8%,transparent); box-shadow:0 20px 50px -24px rgba(0,0,0,.35); }
  .mark { width:72px; height:72px; margin:0 auto 18px; display:grid; place-items:center; border-radius:22px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 14px 28px -12px var(--accent); }
  h1 { margin:0 0 6px; font-size:20px; }
  p { margin:0 0 22px; color:var(--muted); font-size:14px; }
  button { font:inherit; font-weight:700; padding:12px 22px; border:0; border-radius:14px; color:#fff; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4 11 4-8 4 8 4-11"/></svg></div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>Workora برای نمایش اطلاعات به اینترنت نیاز دارد. اتصال را بررسی کن و دوباره امتحان کن.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
